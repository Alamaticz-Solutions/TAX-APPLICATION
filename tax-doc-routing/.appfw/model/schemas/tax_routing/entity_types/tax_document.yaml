- id: 5049dd1b-9e3d-4721-a4f0-262f0e3ff45b
  name: TaxDocument
  is_table: true
  indexes:
  - routing_record_id
  - document_type_route_id
  - assigned_user_id
  facets:
  - audited
  - concurrency

  props:

  - name: id
    fragment: property-primary-key-uuid

  - name: routing_record_id
    caption: Routing Record
    is_required: true
    data_type: Uuid
    foreign_key:
      type_name: TaxRoutingRecord

  # Real FK into the admin-managed DocumentTypeRoute lookup table, so new
  # document types don't require a schema change. Display value (e.g. the
  # route's own `document_type` label) is fetched via the
  # document_type_route navigation relationship, not duplicated here.
  - name: document_type_route_id
    caption: Document Type
    is_required: true
    data_type: Uuid
    foreign_key:
      type_name: DocumentTypeRoute

  # Denormalised copy of TaxRoutingRecord.assigned_operator. Rego evaluates a single row, so
  # "staff only see their own documents" (business spec BR-19) needs the owner on the row itself
  # rather than a join to the parent. The routing service keeps it in step when a record is
  # created or reassigned.
  - name: assigned_user_id
    caption: Assigned To
    is_required: true
    data_type: Uuid
    foreign_key:
      type_name: AppUser

  - name: document_year
    caption: Document Year
    is_required: true
    data_type: Int32

  - name: document_name
    caption: Document Name
    is_caption: true
    is_required: true
    data_type: String

  # PROVISIONAL: modeled as plain String pending a confirmed value list.
  # Conditionally required when the document belongs to an entity; that
  # rule is enforced at the handler/input-validation layer, not here.
  - name: entity_type
    caption: Entity Type
    is_required: false
    data_type: String

  # Joins to TaxEntityList.oracle_id, which is not TaxEntityList's primary
  # key, so this cannot be a `foreign_key` block (those target the other
  # entity's PK). Resolved via the find_entity_by_oracle_id custom method
  # at the handler layer instead.
  - name: entity_oracle_id
    caption: Entity Oracle ID
    is_required: false
    data_type: String

  - name: entity_name
    caption: Entity Name
    is_required: false
    is_read_only: true
    data_type: String

  - name: is_password_protected
    caption: Is Password Protected
    fragment: property-boolean-toggle-required

  - name: box_file_url
    caption: Box File URL
    is_required: false
    is_read_only: true
    data_type: String

  - name: is_duplicate
    caption: Is Duplicate
    is_read_only: true
    fragment: property-boolean-toggle-required

  - name: attachment_file
    caption: Attachment File
    is_required: true
    data_type: String

  - name: k1_attachments
    caption: K-1 Attachments
    is_required: false
    data_type: StringArray

  - name: form_8308_attachments
    caption: Form 8308 Attachments
    is_required: false
    data_type: StringArray

  - name: amended_documents
    caption: Amended Documents
    is_required: false
    data_type: StringArray
