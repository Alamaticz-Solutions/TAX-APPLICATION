# The capability catalogue (business spec section 2.2). `resource` + `action` are the CRUD grant
# a Rego policy matches on; `owner_field` is the column compared against the caller's AppUser id
# when a role_permission row grants this at scope "own". A null resource/action is a capability
# with no direct CRUD entity (a custom method, or a frontend-only affordance like "see the
# Assigned To column"). See docs/architecture/rbac-design.md sections 3-4.
- entity_type: Permission
  schema: tax_routing
  columns: [id, code, name, description, resource, action, owner_field]
  records:

  # Routing records
  - id: fb82caa4-e91b-48f8-b696-9c219f0e61ee
    code: routing_record.create
    name: Create routing record
    description: Create a new tax document routing record.
    resource: tax_routing_record
    action: create
    owner_field: null
  - id: a7b79a25-784f-4774-b8fa-85e25938c621
    code: routing_record.read
    name: Read routing records
    description: View routing records (scope decides whether that is only your own or everyone's).
    resource: tax_routing_record
    action: read
    owner_field: assigned_user_id
  - id: a986327f-425e-4428-a8d1-ab10b839eb49
    code: routing_record.update
    name: Process routing records
    description: Advance a routing record through the workflow.
    resource: tax_routing_record
    action: update
    owner_field: assigned_user_id
  - id: 5d168548-6f91-4cd3-874e-8d123c31b26e
    code: routing_record.cancel
    name: Cancel / withdraw a routing record
    description: Permanently close a record (business spec 9.1). Checked in the cancel_record custom method, not by row filter.
    resource: null
    action: null
    owner_field: null
  - id: f398d344-3aa8-42cd-ba92-dae4f36ef697
    code: routing_record.reassign
    name: Reassign a routing record
    description: Change which user a record is assigned to. Checked in the reassign_record custom method.
    resource: null
    action: null
    owner_field: null
  - id: b2ec1d44-3987-4c9c-9368-50ba0b93b43f
    code: routing_record.bulk_resolve
    name: Bulk-select and resolve records
    description: Deferred capability (design doc section 3); reserved so the frontend can gate it once built.
    resource: null
    action: null
    owner_field: null
  - id: 544ec284-5695-4594-ac63-43e6bf6c0470
    code: routing_record.view_assignee
    name: See the Assigned To column
    description: Frontend-only capability; the Assigned To column is shown when this is granted.
    resource: null
    action: null
    owner_field: null

