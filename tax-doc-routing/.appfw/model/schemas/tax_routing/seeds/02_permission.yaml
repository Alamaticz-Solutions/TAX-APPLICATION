  # RBAC self-management. app_user.read is granted to both roles: every write to a record,
  # document or exception task carries an assigned_user_id foreign key to AppUser, and the
  # framework validates every foreign key with a read-access check against its target entity
  # before the write is allowed — so without this, no Tax Staff write could ever pass FK
  # validation. Everything else here (managing users, roles and the matrix itself) is Tax
