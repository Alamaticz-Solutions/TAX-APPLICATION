schema_version: 1
name: tax-doc-routing-product-offline-agent
description: >
  Least-privilege profile for product agents working on Tax Document Routing
  (schema `tax_routing`, PostgreSQL, MCP/Kafka off, single-tenant).
allowed_commands:
  - command: scripts/appfw product validate --json
    namespace: product
  - command: scripts/appfw product harness-check --json
    namespace: product
  - command: scripts/appfw product boundary-check --json
    namespace: product
  - command: scripts/appfw product generate --check --json
    namespace: product
  - command: scripts/appfw product policy-test --json
    namespace: product
  - command: scripts/appfw product test --fast
    namespace: product
  - command: scripts/appfw product handoff --json
    namespace: product
writable_paths:
  - path: .appfw/model
    ownership: application_source
  - path: .appfw/specs
    ownership: application_source
  - path: .appfw/target/appfw
    ownership: product_evidence
  - path: backend/src/handlers
    ownership: product_source
  - path: backend/src/services
    ownership: product_source
  - path: frontend/src
    ownership: product_source
  - path: rego_test
    ownership: product_source
  - path: target/appfw
    ownership: product_evidence
network_policy: disabled
live_service_policy: disabled
sensitive_capabilities:
  mcp: false
  kafka: false
  release: false
  saas_governed_write: false
threat_controls:
  - ASI01
  - ASI02
  - ASI03
review_checkpoints:
  - model-proposal
  - generated-drift
  - handoff
handoff:
  required: true
  artifact: target/appfw/agent-handoff.json
risk_acceptance:
  - >
    The document store (Box in the source spec, SharePoint later) is a hand-written
    service behind a `DocumentStore` boundary under backend/src/services, not a
    registered framework provider.
