version: '3.8'

# Generated by scripts/appfw generate from .appfw/manifest.yaml and .appfw/model/data_sources/_res.yaml.
# Edit app topology or data-source config, then rerun scripts/appfw generate.
services:

  postgres:
    image: postgres:14
    container_name: ${APP_STACK_NAME:-tax-doc-routing}-postgres
    restart: always
    ports:
      - "${APP_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tax_routing
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    security_opt:
      - label=disable

  backend:
    image: rust:latest
    container_name: ${APP_STACK_NAME:-tax-doc-routing}-backend
    working_dir: /app
    volumes:
      - type: bind
        source: ./backend
        target: /app
      - type: bind
        source: ../app-framework/appfw_runtime
        target: /app-framework/appfw_runtime
      - type: volume
        source: backend-observability-logs
        target: /var/log/app-framework
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    command: >
      sh -c 'apt-get update &&
             apt-get install -y python3-dev python3-pip python3-venv &&
             if [ -f requirements.txt ]; then pip3 install --break-system-packages -r requirements.txt; fi &&
             mkdir -p /var/log/app-framework &&
             rm -f /tmp/backend-log &&
             mkfifo /tmp/backend-log &&
             (tee -a /var/log/app-framework/backend.log < /tmp/backend-log &) &&
             cargo run --bin backend > /tmp/backend-log 2>&1'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-3000}
      - ENV_NAME=${ENV_NAME:-compose}
      - PG_SERVICE_ACCOUNT_NAME=${PG_SERVICE_ACCOUNT_NAME:-postgres}
      - PG_SERVICE_ACCOUNT_PASS=${PG_SERVICE_ACCOUNT_PASS:-postgres}
      - PG_SERVICE_ACCOUNT_PASSWORD=${PG_SERVICE_ACCOUNT_PASSWORD:-postgres}
      - APP_DATA_SOURCE_NAME=${APP_DATA_SOURCE_NAME:-}
      - APP_ENABLE_LOCAL_TEST_AUTH=${APP_ENABLE_LOCAL_TEST_AUTH:-false}
      - APP_PROVIDER_CERTIFICATION_CI=${APP_PROVIDER_CERTIFICATION_CI:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUST_LOG=${RUST_LOG:-backend=info,tower_http=info}
      - APP_LOG_JSON=${APP_LOG_JSON:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-backend}
      - PYTHONPATH=/app/src/handlers/python
    networks:
      - app-network
    security_opt:
      - label=disable

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.6.0}
    container_name: ${APP_STACK_NAME:-tax-doc-routing}-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - type: bind
        source: ../app-framework/observability/loki/loki-config.yaml
        target: /etc/loki/loki-config.yaml
        read_only: true
    tmpfs:
      - /loki:size=512m,mode=1777
    networks:
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1-boringcrypto}
    container_name: ${APP_STACK_NAME:-tax-doc-routing}-alloy
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/tmp/alloy-data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - type: bind
        source: ../app-framework/observability/alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: volume
        source: backend-observability-logs
        target: /var/log/app-framework
        read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.7.3}
    container_name: ${APP_STACK_NAME:-tax-doc-routing}-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-24h}
    depends_on:
      - backend
      - alertmanager
      - alloy
      - loki
    volumes:
      - type: bind
        source: ../app-framework/observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ../app-framework/observability/prometheus/alerts.yml
        target: /etc/prometheus/alerts.yml
        read_only: true
    tmpfs:
      - /prometheus:size=512m,mode=1777
    networks:
      - app-network
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.29.0}
    container_name: ${APP_STACK_NAME:-tax-doc-routing}-alertmanager
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - type: bind
        source: ../app-framework/observability/alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
    tmpfs:
      - /alertmanager:size=128m,mode=1777
    networks:
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.4.3}
    container_name: ${APP_STACK_NAME:-tax-doc-routing}-grafana
    profiles: ["observability"]
    depends_on:
      - loki
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-appfw-local-observability-change-me}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
      - GF_LOG_LEVEL=warn
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - type: bind
        source: ../app-framework/observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ../app-framework/observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
    tmpfs:
      - /var/lib/grafana:size=256m,mode=1777
    networks:
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

volumes:
  postgres-data:
    driver: local
  backend-observability-logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m,mode=1777

networks:
  app-network:
    driver: bridge
  observability-network:
    driver: bridge
