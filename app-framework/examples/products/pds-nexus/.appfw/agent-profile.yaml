schema_version: 1
name: pds-nexus-product-offline-agent
description: Least-privilege profile for agents working on the synthetic PDS Nexus pilot.
allowed_commands:
  - command: scripts/appfw product validate --json
    namespace: product
  - command: scripts/appfw product harness-check --json
    namespace: product
  - command: scripts/appfw product analyze --summary --json
    namespace: product
  - command: scripts/appfw product propose-model --summary --json
    namespace: product
  - command: scripts/appfw product model-status --json
    namespace: product
  - command: scripts/appfw product generate --check --json
    namespace: product
  - command: scripts/appfw product handoff --json
    namespace: product
writable_paths:
  - path: .appfw/model
    ownership: application_source
  - path: .appfw/target/appfw
    ownership: product_evidence
  - path: .appfw/source-evidence
    ownership: product_evidence
  - path: frontend/src
    ownership: product_source
  - path: target/appfw
    ownership: product_evidence
network_policy: disabled
live_service_policy: disabled
sensitive_capabilities:
  mcp: false
  kafka: false
  release: false
  saas_governed_write: false
threat_controls:
  - ASI01
  - ASI02
  - ASI03
review_checkpoints:
  - source-evidence
  - model-proposal
  - generated-drift
  - handoff
handoff:
  required: true
  artifact: target/appfw/agent-handoff.json
risk_acceptance:
  - Synthetic pilot only; no ServiceNow instance, delegated OAuth token, or live governed-write evidence is present.
