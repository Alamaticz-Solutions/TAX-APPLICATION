- name: ix_run_context
  kind: OneToMany
  one:
    entity: IxContext
    field: runs
  many:
    entity: IxRun
    field: context
  storage:
    type: ForeignKey
    owner: IxRun
    field: context_id

- name: ix_run_envelopes
  kind: OneToMany
  one:
    entity: IxRun
    field: envelopes
  many:
    entity: IxCommitEnvelope
    field: run
  storage:
    type: ForeignKey
    owner: IxCommitEnvelope
    field: run_id

- name: ix_run_audit_facts
  kind: OneToMany
  one:
    entity: IxRun
    field: audit_facts
  many:
    entity: IxAuditFact
    field: run
  storage:
    type: ForeignKey
    owner: IxAuditFact
    field: run_id

- name: ix_run_projection_cursors
  kind: OneToMany
  one:
    entity: IxRun
    field: projection_cursors
  many:
    entity: IxProjectionCursor
    field: run
  storage:
    type: ForeignKey
    owner: IxProjectionCursor
    field: run_id
