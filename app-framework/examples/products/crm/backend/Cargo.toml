[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [
    "http",
    "kafka",
    "provider-postgres",
    "provider-neo4j",
]
http = [
    "appfw_runtime/http",
    "dep:async-graphql-axum",
    "dep:axum",
    "dep:hyper",
    "dep:http",
    "dep:tower",
    "dep:tower-http",
]
mcp = ["appfw_runtime/mcp"]
kafka = ["appfw_runtime/kafka"]
sync = ["appfw_runtime/sync"]
provider-postgres = ["dep:appfw_provider_postgres"]
provider-mongo = ["dep:appfw_provider_mongo", "dep:mongodb"]
provider-mssql = ["dep:appfw_provider_mssql"]
provider-snowflake = ["dep:appfw_provider_snowflake"]
provider-neo4j = ["dep:appfw_provider_neo4j"]

[dependencies]

anyhow = "1.0"
appfw_provider_mongo = { package = "appfw-provider-mongo", path = "../../../../appfw_provider_mongo", optional = true }
appfw_provider_mssql = { package = "appfw-provider-mssql", path = "../../../../appfw_provider_mssql", optional = true }
appfw_mssql_auth = { package = "appfw-mssql-auth", path = "../../../../appfw_mssql_auth" }
appfw_provider_neo4j = { package = "appfw-provider-neo4j", path = "../../../../appfw_provider_neo4j", features = ["bolt"], optional = true }
appfw_provider_postgres = { package = "appfw-provider-postgres", path = "../../../../appfw_provider_postgres", optional = true }
appfw_provider_snowflake = { package = "appfw-provider-snowflake", path = "../../../../appfw_provider_snowflake", optional = true }
appfw_runtime = { package = "appfw-runtime", path = "../../../../appfw_runtime", default-features = false }
async-graphql = { version = "6", features = ["bson", "chrono", "dynamic-schema"] }
async-graphql-value = "6"
async-graphql-axum = { version = "6", optional = true }
async-trait = "0.1"
axum = { version = "0.6", features = ["macros"], optional = true }

bson = "2.0"
bytes = "1.7"

chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"

deadpool = "0.12"
deadpool-postgres = "0.12"
derivative = "2.2"
dotenv = "0.15"

hyper = { version = "1.0", optional = true }

Inflector = "*"

futures = "0.3"
futures-util = "0.3.27"

governor = "0.10"

http = { version = "=1.1.0", optional = true }

json = "0.12"

mongodb = { version = "3.1", optional = true }

postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4"] }

regorus = "0.2"
regex = "1"

serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
slab = "0.4.7"

thiserror = "2.0.12"
time = { version = "0.3", features = ["macros"] }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.4", features = ["cors", "fs", "request-id", "trace"], optional = true }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = {version="0.7", features=["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"]}


uuid = { version = "1", features = ["serde", "v4"] }

opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "trace"] }
