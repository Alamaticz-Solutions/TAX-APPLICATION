- id: add00000-0000-4000-8000-000000000016
  name: Address
  is_table: true
  indexes:
  - account_id
  - contact_id
  - country
  - state
  facets:
  - concurrency

  props:

  - name: id
    fragment: property-primary-key-uuid

  - name: name
    caption: Address Name
    is_caption: true
    data_type: String

  - name: address_type
    caption: Address Type
    is_required: true
    data_type: String

  - name: street1
    caption: Street 1
    is_required: true
    data_type: String

  - name: street2
    caption: Street 2
    data_type: String

  - name: city
    caption: City
    is_required: true
    data_type: String

  - name: state
    caption: State
    data_type: String

  - name: postal_code
    caption: Postal Code
    data_type: String

  - name: country
    caption: Country
    is_required: true
    data_type: String

  - name: latitude
    caption: Latitude
    data_type: Float64

  - name: longitude
    caption: Longitude
    data_type: Float64

  - name: is_primary
    caption: Is Primary
    fragment: property-boolean-toggle-required

  - name: account_id
    caption: Account
    data_type: Uuid
    foreign_key:
      type_name: Account

  - name: contact_id
    caption: Contact
    data_type: Uuid
    foreign_key:
      type_name: Contact
