# Activity - seeded entity coverage with several NavToOne relationships.

- name: find_activity
  description: find seeded activity by id as admin
  auth_token: pdsh_admin
  graphql:
    schema: crm
    type: query
    name: findActivity
    variables:
    - name: id
      type: String!
      literal_value: '"ac710007-0000-4000-8000-100000000001"'
    select: |
      id,subject,status,type_id,account_id,contact_id,opportunity_id,activity_type { id,name },account { id,name },contact { id,first_name,last_name },opportunity { id,name }
  expect:
    data:
      id: 'ac710007-0000-4000-8000-100000000001'
      subject: 'Discovery Call - Acme Dental'
      status: 'Completed'
      type_id: 'ac71ec00-0000-4000-8000-100000000002'
      account_id: 'a0c00000-0000-4000-8000-100000000001'
      contact_id: 'c0c00000-0000-4000-8000-100000000001'
      opportunity_id: '099c0000-0000-4000-8000-100000000001'
