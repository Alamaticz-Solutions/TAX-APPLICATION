  - name: last_name
    caption: Last Name
    is_caption: true
    is_required: true
    data_type: String

  - name: email
    caption: Email
    data_type: String

  - name: phone
    caption: Phone
    data_type: String

  - name: mobile
    caption: Mobile
    data_type: String

  - name: title
    caption: Title
    data_type: String

  - name: department
    caption: Department
    data_type: String

  - name: mailing_street
    caption: Mailing Street
    data_type: String

  - name: mailing_city
    caption: Mailing City
    data_type: String

  - name: mailing_state
    caption: Mailing State
    data_type: String

  - name: mailing_postal_code
    caption: Mailing Postal Code
    data_type: String

  - name: mailing_country
    caption: Mailing Country
    data_type: String

  - name: account_id
    caption: Account
