# ActivityType - seeded lookup coverage.

- name: find_activity_type
  description: find seeded activity type by id as admin
  auth_token: pdsh_admin
  graphql:
    schema: crm
    type: query
    name: findActivityType
    variables:
    - name: id
      type: String!
      literal_value: '"ac71ec00-0000-4000-8000-100000000001"'
    select: |
      id,name,sort_order
  expect:
    data:
      id: 'ac71ec00-0000-4000-8000-100000000001'
      name: 'Email'
      sort_order: 10
