[package]
name = "appfw-provider-neo4j"
version = "0.2.0"
edition = "2021"
description = "Neo4j graph read + governed-write provider support for App Framework."
publish = ["pds-app-framework-crates"]

[features]
default = []
# Opt-in live Bolt driver (neo4rs). Default builds/tests stay driver-free and
# offline; enable `bolt` for the live `Neo4jBoltExecutor`.
bolt = ["dep:neo4rs"]

[dependencies]
appfw_runtime = { package = "appfw-runtime", version = "0.2.0", path = "../appfw_runtime", registry = "pds-app-framework-crates", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
neo4rs = { version = "0.9.0-rc.10", optional = true, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
