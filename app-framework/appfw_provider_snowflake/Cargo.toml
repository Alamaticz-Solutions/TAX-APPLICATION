[package]
name = "appfw-provider-snowflake"
version = "0.2.0"
edition = "2021"
description = "Snowflake provider implementation support for App Framework."
publish = ["pds-app-framework-crates"]

[dependencies]
appfw_runtime = { package = "appfw-runtime", version = "0.2.0", path = "../appfw_runtime", registry = "pds-app-framework-crates", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
