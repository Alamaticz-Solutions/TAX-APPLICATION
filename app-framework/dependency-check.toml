reason = "Named human GO 2026-08-18 option 2 (PoC architecture-validation): leftover metro→RN image-size@1.2.1 in native-components has no published advisory-clean metro/image-size; npm's only advertised fix is a forbidden React Native 0.72.17 downgrade. Accept this GHSA on paper only for image-size 1.2.1. Does not claim the advisory is false or fixed. Remove this accept when a published metro or image-size drops GHSA-5p2g-fcmc-qvqq. Do not accept nanoid or ajv."

