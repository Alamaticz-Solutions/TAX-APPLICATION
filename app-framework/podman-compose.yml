version: '3.8'

# Generated by scripts/appfw generate from .appfw/manifest.yaml and app_gen/_config/data_sources/_res.yaml.
# Edit app topology or data-source config, then rerun scripts/appfw generate.
services:

  mongo:
    image: mongo:7
    container_name: ${APP_STACK_NAME:-crm-sample}-mongo
    restart: always
    ports:
      - "${APP_MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_SERVICE_ACCOUNT_NAME:-mongo}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_SERVICE_ACCOUNT_PASS:-mongo}"
    volumes:
      - type: volume
        source: mongo-data
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network
    security_opt:
      - label=disable

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${APP_STACK_NAME:-crm-sample}-mssql
    restart: always
    ports:
      - "${APP_MSSQL_HOST_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SERVICE_ACCOUNT_PASS:-YourStrong!Passw0rd}"
      MSSQL_PID: Developer
    volumes:
      - type: volume
        source: mssql-data
        target: /var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    security_opt:
      - label=disable

  postgres:
    image: postgres:14
    container_name: ${APP_STACK_NAME:-crm-sample}-postgres
    restart: always
    ports:
      - "${APP_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_framework
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    security_opt:
      - label=disable

  snowflake:
    image: localstack/snowflake:${LOCALSTACK_SNOWFLAKE_TAG:-stable}
    container_name: ${APP_STACK_NAME:-crm-sample}-snowflake
    profiles: ["snowflake"]
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
      - "127.0.0.1:443:443"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SF_DEFAULT_USER=${SNOWFLAKE_SERVICE_ACCOUNT_NAME:-test}
      - SF_DEFAULT_PASSWORD=${SNOWFLAKE_SERVICE_ACCOUNT_PASS:-test}
      - SF_LOG=${SF_LOG:-}
    volumes:
      - type: volume
        source: snowflake-data
        target: /var/lib/localstack
    networks:
      app-network:
        aliases:
          - snowflake.localhost.localstack.cloud
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://snowflake.localhost.localstack.cloud:4566/session', data=b'{}', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - label=disable

  broker:
    image: ${KAFKA_IMAGE:-apache/kafka:latest}
    hostname: broker
    container_name: ${APP_STACK_NAME:-crm-sample}-broker
    profiles: ["kafka"]
    ports:
      - "127.0.0.1:${APP_KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:${APP_KAFKA_HOST_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${APP_KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server broker:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-network
    security_opt:
      - label=disable

  kafka-smoke:
    image: ${KAFKA_IMAGE:-apache/kafka:latest}
    container_name: ${APP_STACK_NAME:-crm-sample}-kafka-smoke
    profiles: ["kafka"]
    depends_on:
      broker:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
          until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --list >/dev/null 2>&1; do
            sleep 2
          done
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --create --if-not-exists --topic 'crm.events'
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --list
    networks:
      - app-network
    security_opt:
      - label=disable

  backend:
    image: rust:latest
    container_name: ${APP_STACK_NAME:-crm-sample}-backend
    working_dir: /app
    volumes:
      - type: bind
        source: ./backend
        target: /app
      - type: bind
        source: ./appfw_runtime
        target: /appfw_runtime
      - type: volume
        source: backend-observability-logs
        target: /var/log/app-framework
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    command: >
      sh -c 'apt-get update &&
             apt-get install -y python3-dev python3-pip python3-venv &&
             apt-get install -y --no-install-recommends ca-certificates curl gnupg unixodbc unixodbc-dev tdsodbc freetds-bin freetds-common &&
             curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg &&
             echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list &&
             apt-get update &&
             ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 &&
             MS_DRIVER_PATH="$(ls /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18*.so.* 2>/dev/null | head -1)" &&
             printf "%s\n" "[FreeTDS]" "Description=FreeTDS Driver" "Driver=/usr/lib/x86_64-linux-gnu/odbc/libtdsodbc.so" "Setup=/usr/lib/x86_64-linux-gnu/odbc/libtdsodbc.so" "UsageCount=1" "" "[ODBC Driver 18 for SQL Server]" "Description=Microsoft ODBC Driver 18 for SQL Server" "Driver=${MS_DRIVER_PATH}" "UsageCount=1" > /etc/odbcinst.ini &&
             if [ -f requirements.txt ]; then pip3 install --break-system-packages -r requirements.txt; fi &&
             mkdir -p /var/log/app-framework &&
             rm -f /tmp/backend-log &&
             mkfifo /tmp/backend-log &&
             (tee -a /var/log/app-framework/backend.log < /tmp/backend-log &) &&
             cargo run --bin backend > /tmp/backend-log 2>&1'
    depends_on:
      mongo:
        condition: service_healthy
      mssql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-3000}
      - ENV_NAME=${ENV_NAME:-compose}
      - PG_SERVICE_ACCOUNT_NAME=${PG_SERVICE_ACCOUNT_NAME:-postgres}
      - PG_SERVICE_ACCOUNT_PASS=${PG_SERVICE_ACCOUNT_PASS:-postgres}
      - PG_SERVICE_ACCOUNT_PASSWORD=${PG_SERVICE_ACCOUNT_PASSWORD:-postgres}
      - MONGO_SERVICE_ACCOUNT_NAME=${MONGO_SERVICE_ACCOUNT_NAME:-mongo}
      - MONGO_SERVICE_ACCOUNT_PASS=${MONGO_SERVICE_ACCOUNT_PASS:-mongo}
      - MSSQL_SERVICE_ACCOUNT_NAME=${MSSQL_SERVICE_ACCOUNT_NAME:-sa}
      - MSSQL_SERVICE_ACCOUNT_PASS=${MSSQL_SERVICE_ACCOUNT_PASS:-YourStrong!Passw0rd}
      - SNOWFLAKE_HOST=${SNOWFLAKE_HOST:-}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-}
      - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-}
      - SNOWFLAKE_AUTH_TOKEN_TYPE=${SNOWFLAKE_AUTH_TOKEN_TYPE:-PROGRAMMATIC_ACCESS_TOKEN}
      - SNOWFLAKE_SERVICE_ACCOUNT_NAME=${SNOWFLAKE_SERVICE_ACCOUNT_NAME:-}
      - SNOWFLAKE_SERVICE_ACCOUNT_PASS=${SNOWFLAKE_SERVICE_ACCOUNT_PASS:-}
      - SNOWFLAKE_ACCESS_TOKEN=${SNOWFLAKE_ACCESS_TOKEN:-}
      - APPFW_KAFKA_BOOTSTRAP_SERVERS=${APPFW_KAFKA_BOOTSTRAP_SERVERS:-broker:29092}
      - APPFW_KAFKA_SECURITY_PROTOCOL=${APPFW_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - APP_DATA_SOURCE_NAME=${APP_DATA_SOURCE_NAME:-}
      - APP_ENABLE_LOCAL_TEST_AUTH=${APP_ENABLE_LOCAL_TEST_AUTH:-false}
      - APP_PROVIDER_CERTIFICATION_CI=${APP_PROVIDER_CERTIFICATION_CI:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUST_LOG=${RUST_LOG:-backend=info,tower_http=info}
      - APP_LOG_JSON=${APP_LOG_JSON:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-backend}
      - PYTHONPATH=/app/src/handlers/python
    networks:
      - app-network
    security_opt:
      - label=disable

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.6.0}
    container_name: ${APP_STACK_NAME:-crm-sample}-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - type: bind
        source: ./observability/loki/loki-config.yaml
        target: /etc/loki/loki-config.yaml
        read_only: true
    tmpfs:
      - /loki:size=512m,mode=1777
    networks:
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1-boringcrypto}
    container_name: ${APP_STACK_NAME:-crm-sample}-alloy
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/tmp/alloy-data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - type: bind
        source: ./observability/alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: volume
        source: backend-observability-logs
        target: /var/log/app-framework
        read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.7.3}
    container_name: ${APP_STACK_NAME:-crm-sample}-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-24h}
    depends_on:
      - backend
      - alloy
      - loki
    volumes:
      - type: bind
        source: ./observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    tmpfs:
      - /prometheus:size=512m,mode=1777
    networks:
      - app-network
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.4.3}
    container_name: ${APP_STACK_NAME:-crm-sample}-grafana
    profiles: ["observability"]
    depends_on:
      - loki
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-appfw-local-observability-change-me}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
      - GF_LOG_LEVEL=warn
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - type: bind
        source: ./observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
    tmpfs:
      - /var/lib/grafana:size=256m,mode=1777
    networks:
      - observability-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - label=disable

  snowflake-smoke:
    image: curlimages/curl:8.10.1
    profiles: ["snowflake"]
    depends_on:
      snowflake:
        condition: service_healthy
    command: >
      sh -c 'curl -fsS -d "{}" "http://snowflake.localhost.localstack.cloud:4566/session" &&
             curl -fsS "http://snowflake.localhost.localstack.cloud:4566/api/v2/statements?nullable=true"
               -X POST
               -H "Content-Type: application/json"
               -d "{\"statement\":\"SELECT 1\",\"timeout\":60,\"database\":\"test\"}"'
    environment:
      - SNOWFLAKE_ACCESS_TOKEN=${SNOWFLAKE_ACCESS_TOKEN:-test}
      - SNOWFLAKE_AUTH_TOKEN_TYPE=${SNOWFLAKE_AUTH_TOKEN_TYPE:-LOCALSTACK_NO_AUTH}
    networks:
      app-network:
        aliases:
          - snowflake-smoke
    security_opt:
      - label=disable

volumes:
  mongo-data:
    driver: local
  mssql-data:
    driver: local
  postgres-data:
    driver: local
  snowflake-data:
    driver: local
  backend-observability-logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m,mode=1777

networks:
  app-network:
    driver: bridge
  observability-network:
    driver: bridge
