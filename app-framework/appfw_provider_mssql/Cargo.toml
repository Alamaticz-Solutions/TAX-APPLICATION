[package]
name = "appfw-provider-mssql"
version = "0.2.0"
edition = "2021"
description = "MS SQL Server provider implementation support for App Framework."
publish = ["pds-app-framework-crates"]

[features]
default = ["fabric-vendored-unix-odbc"]
fabric-vendored-unix-odbc = ["odbc-api/vendored-unix-odbc"]

[dependencies]
appfw_runtime = { package = "appfw-runtime", version = "0.2.0", path = "../appfw_runtime", registry = "pds-app-framework-crates", default-features = false }
appfw_mssql_auth = { package = "appfw-mssql-auth", version = "0.1.1", path = "../appfw_mssql_auth", registry = "pds-app-framework-crates" }
bb8 = "0.9"
chrono = { version = "0.4", features = ["serde"] }
odbc-api = { version = "28.1.0", default-features = false, features = ["odbc_version_3_80"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
