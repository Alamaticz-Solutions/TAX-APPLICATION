[package]
name = "database"
version = "0.1.1"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

appfw_runtime = { package = "appfw-runtime", path = "../appfw_runtime" }
appfw_mssql_auth = { package = "appfw-mssql-auth", path = "../appfw_mssql_auth" }
appfw_provider_mssql = { package = "appfw-provider-mssql", path = "../appfw_provider_mssql" }
bytes = "1.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
deadpool-postgres = "0.12.1"
dotenv = "0.15"

postgres-types = { version = "0.2", features = ["derive"] }

serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"

tokio = { version = "1", features = ["full"] }

tokio-postgres = {version="0.7", features=["with-serde_json-1", "with-uuid-1"]}

futures-util = "0.3"
reqwest = { workspace = true }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }

# MongoDB
mongodb = "3.1"
bson = "2.0"

uuid = { version = "1", features = ["serde", "v4"] }
